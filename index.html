<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FAF6EF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ready When You Are">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23FAF6EF'/%3E%3Cg fill='%23B09878'%3E%3Cellipse cx='50' cy='63.5' rx='21.5' ry='17.5'/%3E%3Cellipse cx='23.5' cy='37.5' rx='10.5' ry='13.5'/%3E%3Cellipse cx='41.5' cy='21.5' rx='9.8' ry='13'/%3E%3Cellipse cx='61.5' cy='21.5' rx='9.8' ry='13'/%3E%3Cellipse cx='77.5' cy='37.5' rx='10.5' ry='13.5'/%3E%3C/g%3E%3C/svg%3E">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Ready When You Are</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Space+Mono:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FAF6EF;
    --bg-card: #FFFFFF;
    --bg-card-hover: #F3EDE2;
    --ember: #E04A22;
    --ember-dim: #C7431F;
    --gold: #C98A12;
    --text: #2A231C;
    --text-muted: #7C7064;
    --text-faint: #A79B8D;
    --ring-track: #E7DFD2;
    --amber: #F5A31E;
    --amber-deep: #E08308;
    --amber-ink: #3D2300;
    --steel: #6B93AF;
    --steel-deep: #4C7592;
    --steel-ink: #E4EEF5;
    --cyan: #1BA4C4;
    --cyan-deep: #1487A8;
    --cyan-ink: #F7EEE0;
    --success-glow: rgba(201, 138, 18, 0.28);
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  button, .msg-reset, .toggle{ touch-action: manipulation; }

  body{
    background: radial-gradient(120% 90% at 50% -10%, #FFFDF9 0%, var(--bg) 55%);
    color: var(--text);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    min-height: 100vh;
    display:flex;
    justify-content:center;
    padding: 32px 16px calc(60px + env(safe-area-inset-bottom));
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
  }

  .app{
    width:100%;
    max-width: 420px;
    display:flex;
    flex-direction:column;
    gap: 28px;
  }

  /* ---------- Header ---------- */
  .eyebrow{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    font-family:'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.22em;
    color: var(--text-faint);
    text-transform: uppercase;
  }
  .eyebrow .dot{
    width:5px; height:5px; border-radius:50%;
    background: var(--ember);
    box-shadow: 0 0 8px var(--ember);
  }
  h1{
    text-align:center;
    font-family: 'Gaegu', 'Zen Kaku Gothic New', cursive;
    font-size: 36px;
    font-weight: 700;
    margin: 4px 0 0;
    letter-spacing: 0.01em;
    line-height: 1.25;
    color: #7C6247;
  }
  .paw-mark{
    display:flex;
    justify-content:center;
    margin-top: 10px;
  }
  .paw-mark svg{
    width: 32px;
    height: 27px;
    fill: #C7AC87;
    opacity: 0.85;
  }
  .sub{
    text-align:center;
    color: var(--text-muted);
    font-size: 13.5px;
    margin-top: 8px;
    line-height:1.6;
  }

  /* ---------- Hero dial ---------- */
  .dial-wrap{
    position:relative;
    width: 260px;
    height: 260px;
    margin: 4px auto 0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .glow{
    position:absolute;
    inset: -10px;
    border-radius:50%;
    background: radial-gradient(circle, var(--ember) 0%, transparent 70%);
    opacity: 0.10;
    filter: blur(22px);
    animation: breathe 3.4s ease-in-out infinite;
  }
  .glow.running{ opacity:0.20; animation-duration: 1.6s; }
  @keyframes breathe{
    0%,100%{ transform: scale(0.94); opacity:0.08; }
    50%{ transform: scale(1.04); opacity:0.18; }
  }

  svg.ring{ transform: rotate(-90deg); }
  .ring-track{ stroke: var(--ring-track); }
  .ring-fill{
    stroke-linecap: round;
    transition: stroke-dashoffset 0.25s linear, stroke 0.6s ease;
  }
  .ring-fill.overtime{ animation: overtimePulse 1.2s ease-in-out infinite; }
  @keyframes overtimePulse{
    0%,100%{ opacity: 1; }
    50%{ opacity: 0.45; }
  }

  .dial-center{
    position:absolute;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 6px;
  }
  .time-display{
    font-family:'Space Mono', monospace;
    font-size: 42px;
    font-weight:700;
    letter-spacing: 0.01em;
    font-variant-numeric: tabular-nums;
  }
  .state-label{
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 0.08em;
  }

  /* ---------- Walking dog ---------- */
  .walker{
    position:absolute;
    left: 0; top: 0;
    width: 34px;
    height: 34px;
    margin-left: -17px;
    margin-top: -17px;
    pointer-events:none;
    transition: transform 0.25s linear;
    z-index: 3;
  }
  .walker svg{ width:100%; height:100%; overflow: visible; }
  .dog-body{ fill: #8A6C4F; }
  .dog-dark{ fill: #6E5339; }
  .dog-light{ fill: #C7AC87; }
  .dog-nose{ fill: #3D2E20; }

  .walker .bob{ animation: dogBob 0.52s ease-in-out infinite; transform-origin: 17px 24px; }
  .walker .leg-a{ animation: legA 0.52s ease-in-out infinite; }
  .walker .leg-b{ animation: legB 0.52s ease-in-out infinite; }
  .walker .tail{ animation: tailWag 0.42s ease-in-out infinite; transform-origin: 6px 15px; }
  .walker.idle .bob,
  .walker.idle .leg-a,
  .walker.idle .leg-b{ animation: none; }

  @keyframes dogBob{
    0%,100%{ transform: translateY(0); }
    50%{ transform: translateY(-1.4px); }
  }
  @keyframes legA{
    0%,100%{ transform: translateX(1.6px); }
    50%{ transform: translateX(-1.6px); }
  }
  @keyframes legB{
    0%,100%{ transform: translateX(-1.6px); }
    50%{ transform: translateX(1.6px); }
  }
  @keyframes tailWag{
    0%,100%{ transform: rotate(-14deg); }
    50%{ transform: rotate(16deg); }
  }

  .walker.bark svg{ animation: barkPop 0.36s cubic-bezier(0.2, 1.5, 0.4, 1); }
  @keyframes barkPop{
    0%{ transform: scale(1) translateY(0); }
    35%{ transform: scale(1.22) translateY(-3px); }
    100%{ transform: scale(1) translateY(0); }
  }

  @media (prefers-reduced-motion: reduce){
    .walker .bob, .walker .leg-a, .walker .leg-b, .walker .tail{ animation: none; }
  }

  /* ---------- Action button ---------- */
  .btn-slot{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height: 168px;
  }

  .action-btn{
    appearance:none;
    border:none;
    cursor:pointer;
    width: 200px;
    max-width: 100%;
    padding: 18px 24px;
    border-radius: 14px;
    font-family:'Space Mono', monospace;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.14em;
    color: #FFFCF6;
    background: linear-gradient(135deg, #D6BE9C, #C7AC87 55%, #B79A73);
    box-shadow: 0 8px 20px -8px rgba(183, 154, 115, 0.55);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .action-btn:active{ transform: scale(0.97); }

  /* Round CHECK IN button */
  .checkin-wrap{
    position: relative;
    width: 168px;
    height: 168px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .halo{
    position:absolute;
    width: 144px;
    height: 144px;
    border-radius: 50%;
    border: 2px solid var(--cyan);
    opacity: 0;
    pointer-events: none;
    animation: haloOut 2.2s ease-out infinite;
    transition: border-color 0.6s ease;
  }
  .halo.d2{ animation-delay: 0.73s; }
  .halo.d3{ animation-delay: 1.46s; }
  @keyframes haloOut{
    0%{ transform: scale(1); opacity: 0.5; }
    100%{ transform: scale(1.55); opacity: 0; }
  }

  .checkin-btn{
    position: relative;
    appearance:none;
    border:none;
    cursor:pointer;
    width: 144px;
    height: 144px;
    border-radius: 50%;
    font-family:'Space Mono', monospace;
    font-size: 46px;
    font-weight: 700;
    letter-spacing: 0.02em;
    line-height: 1;
    color: #FFE08A;
    background: radial-gradient(circle at 34% 28%, #35C2DC, var(--cyan) 58%, var(--cyan-deep) 100%);
    box-shadow: 0 12px 30px -10px rgba(20, 135, 168, 0.5),
                inset 0 -3px 8px rgba(15, 105, 130, 0.22);
    text-shadow: 0 1px 2px rgba(48, 28, 8, 0.4),
                 0 2px 6px rgba(40, 24, 6, 0.28);
    -webkit-text-stroke: 0.25px rgba(52, 30, 8, 0.3);
    animation: beckon 2.2s ease-in-out infinite;
    transition: transform 0.1s ease, background 0.6s ease, box-shadow 0.6s ease;
  }
  .checkin-btn:active{ transform: scale(0.94); animation: none; }
  @keyframes beckon{
    0%,100%{ transform: scale(1); }
    45%{ transform: scale(1.07); }
    62%{ transform: scale(1.01); }
  }

  /* Message shown right after GO! */
  .started-msg{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 8px;
    text-align:center;
    animation: msgIn 0.5s ease-out;
    padding: 12px 8px;
  }
  @keyframes msgIn{
    from{ opacity:0; transform: translateY(8px) scale(0.97); }
    to{ opacity:1; transform: none; }
  }
  .started-msg .big{
    font-family:'Space Mono', monospace;
    font-size: 27px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--cyan-deep);
    line-height: 1.2;
  }
  .started-msg .small{
    font-size: 14px;
    color: var(--text-muted);
    letter-spacing: 0.02em;
  }
  .started-msg .hint{
    font-family:'Space Mono', monospace;
    font-size: 10.5px;
    color: var(--text-faint);
    margin-top: 4px;
  }
  .msg-reset{
    appearance:none;
    cursor:pointer;
    margin-top: 10px;
    padding: 9px 26px;
    border-radius: 10px;
    border: 1px solid var(--ring-track);
    background: var(--bg-card);
    color: var(--text-muted);
    font-family:'Space Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.14em;
    transition: background 0.15s ease, color 0.15s ease, transform 0.1s ease;
  }
  .msg-reset:hover{ background: var(--bg-card-hover); color: var(--text); }
  .msg-reset:active{ transform: scale(0.96); }

  @media (prefers-reduced-motion: reduce){
    .halo{ animation: none; opacity: 0.22; }
    .checkin-btn{ animation: none; }
    .glow{ animation: none; }
    .ring-fill.overtime{ animation: none; }
  }

  /* ---------- Daily chart ---------- */
  .chart-card{
    background: var(--bg-card);
    border: 1px solid var(--ring-track);
    border-radius: 14px;
    padding: 16px 14px 12px;
    box-shadow: 0 1px 3px rgba(42, 35, 28, 0.04);
  }
  .chart-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom: 14px;
    padding: 0 2px;
  }
  .chart-head .t{ font-size: 13px; color: var(--text-muted); letter-spacing: 0.04em; }
  .chart-head .legend{
    font-family:'Space Mono', monospace;
    font-size: 10.5px;
    color: var(--text-faint);
    display:flex; align-items:center; gap:5px;
  }
  .swatch{ width:8px; height:8px; border-radius:2px; background: var(--gold); display:inline-block; }

  .chart-body{
    position: relative;
    height: 104px;
  }
  .bars{
    display:flex;
    align-items:flex-end;
    gap: 6px;
    height: 100%;
  }
  .goal-line{
    position:absolute;
    left:0; right:0;
    border-top: 1px dashed rgba(201, 138, 18, 0.6);
    pointer-events:none;
    z-index: 2;
  }
  .goal-tag{
    position:absolute;
    right: 0;
    transform: translateY(-100%);
    font-family:'Space Mono', monospace;
    font-size: 9.5px;
    color: var(--gold);
    padding-bottom: 2px;
  }
  .bar-col{
    flex: 1;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    align-items:center;
    height: 100%;
    min-width: 0;
  }
  .bar-slot{
    flex: 1;
    width: 100%;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    min-height: 0;
  }
  .bar{
    width: 100%;
    max-width: 26px;
    border-radius: 5px 5px 3px 3px;
    background: #D9CFC0;
    transition: height 0.4s ease;
  }
  .bar.gold{ background: linear-gradient(180deg, #E9B441, var(--gold)); }
  .day-labels{
    display:flex;
    gap: 6px;
    margin-top: 7px;
  }
  .day-labels span{
    flex: 1;
    text-align:center;
    font-family:'Space Mono', monospace;
    font-size: 9.5px;
    color: var(--text-faint);
    white-space: nowrap;
    min-width: 0;
  }
  .bar-day{
    font-family:'Space Mono', monospace;
    font-size: 9.5px;
    color: var(--text-faint);
    white-space: nowrap;
  }
  .bar-val{
    font-family:'Space Mono', monospace;
    font-size: 9.5px;
    color: var(--text-muted);
    white-space: nowrap;
  }
  .bar-val.gold{ color: var(--gold); font-weight:700; }
  .chart-empty{
    height: 104px;
    display:flex;
    align-items:center;
    justify-content:center;
    color: var(--text-faint);
    font-size: 12.5px;
    text-align:center;
    line-height:1.6;
  }

  /* ---------- Result banner ---------- */
  .result{
    text-align:center;
    padding: 14px 16px;
    border-radius: 14px;
    background: var(--bg-card);
    border: 1px solid var(--ring-track);
    box-shadow: 0 1px 3px rgba(42, 35, 28, 0.04);
    font-size: 14px;
    color: var(--text-muted);
    min-height: 20px;
    opacity:0;
    transform: translateY(-6px);
    transition: opacity 0.35s ease, transform 0.35s ease;
  }
  .result.show{ opacity:1; transform:translateY(0); }
  .result.celebrate{
    background: linear-gradient(135deg, rgba(201,138,18,0.10), rgba(224,74,34,0.07));
    border-color: rgba(201,138,18,0.35);
    color: #A06E0A;
    font-weight: 700;
  }

  /* ---------- Stats ---------- */
  .stats-grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .stat-card{
    background: var(--bg-card);
    border: 1px solid var(--ring-track);
    border-radius: 14px;
    padding: 14px 16px;
    box-shadow: 0 1px 3px rgba(42, 35, 28, 0.04);
  }
  .stat-label{
    font-size: 11.5px;
    color: var(--text-muted);
    letter-spacing: 0.03em;
  }
  .stat-value{
    font-family:'Space Mono', monospace;
    font-size: 22px;
    font-weight:700;
    margin-top: 4px;
    font-variant-numeric: tabular-nums;
  }
  .stat-value.accent{ color: var(--gold); }

  /* ---------- Log list ---------- */
  .section-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size: 13px;
    color: var(--text-muted);
    letter-spacing: 0.04em;
    padding: 0 2px;
  }
  .reset-btn{
    background:none;
    border:none;
    color: var(--text-faint);
    font-size: 12px;
    cursor:pointer;
    text-decoration: underline;
    font-family: inherit;
  }
  .reset-btn:hover{ color: var(--ember); }

  .log-list{
    display:flex;
    flex-direction:column;
    gap: 6px;
    max-height: 260px;
    overflow-y:auto;
    padding-right: 2px;
  }
  .log-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background: var(--bg-card);
    border: 1px solid var(--ring-track);
    border-radius: 12px;
    padding: 11px 14px;
    font-size: 13.5px;
    box-shadow: 0 1px 3px rgba(42, 35, 28, 0.04);
  }
  .log-item .left{
    display:flex;
    align-items:center;
    gap:8px;
    color: var(--text-muted);
  }
  .log-item .badge{
    font-size: 13px;
  }
  .log-item .elapsed{
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-variant-numeric: tabular-nums;
  }
  .log-item .elapsed.fast{ color: var(--gold); }

  .empty-state{
    text-align:center;
    color: var(--text-faint);
    font-size: 13px;
    padding: 24px 12px;
    background: var(--bg-card);
    border-radius: 14px;
    border: 1px dashed var(--ring-track);
  }

  /* ---------- Settings ---------- */
  .settings{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background: var(--bg-card);
    border: 1px solid var(--ring-track);
    border-radius: 14px;
    padding: 12px 16px;
    font-size: 13px;
    color: var(--text-muted);
    box-shadow: 0 1px 3px rgba(42, 35, 28, 0.04);
  }
  .settings input{
    width: 56px;
    background: var(--bg);
    border: 1px solid var(--ring-track);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 8px;
    font-family:'Space Mono', monospace;
    font-size: 13px;
    text-align:center;
  }

  .toggle{
    appearance:none;
    cursor:pointer;
    border: 1px solid var(--ring-track);
    background: var(--bg);
    color: var(--text-faint);
    border-radius: 999px;
    padding: 5px 16px;
    font-family:'Space Mono', monospace;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.1em;
    transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }
  .toggle.on{
    background: var(--cyan);
    border-color: var(--cyan-deep);
    color: var(--cyan-ink);
  }

  /* Celebration burst */
  .burst-layer{
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 50;
  }
  .spark{
    position: absolute;
    border-radius: 50%;
    opacity: 0;
    transform: translate(-50%, -50%);
    animation: sparkOut 1.1s cubic-bezier(0.16, 0.8, 0.3, 1) forwards;
  }
  @keyframes sparkOut{
    0%{ opacity: 0; transform: translate(-50%, -50%) scale(0.4); }
    18%{ opacity: 1; }
    100%{
      opacity: 0;
      transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0.7);
    }
  }

  .started-msg.gold .big{ color: var(--gold); }
  .started-msg .medal{
    font-size: 30px;
    line-height: 1;
    animation: medalPop 0.6s cubic-bezier(0.2, 1.4, 0.4, 1);
  }
  @keyframes medalPop{
    0%{ transform: scale(0.3); opacity: 0; }
    100%{ transform: scale(1); opacity: 1; }
  }

  .loading{
    text-align:center;
    color: var(--text-faint);
    font-size: 13px;
    padding: 40px 0;
  }

  ::-webkit-scrollbar{ width:5px; }
  ::-webkit-scrollbar-thumb{ background: #DDD3C4; border-radius:4px; }
</style>
</head>
<body>

<div class="app" id="app">
  <div class="loading" id="loading">Loading...</div>
</div>

<script>
(function(){
  const STORAGE_KEY = 'start_tracker_data';
  const DEFAULT_DATA = { runningStart: null, thresholdSec: 180, soundOn: true, logs: [] };
  let data = null;
  let tickHandle = null;

  const app = document.getElementById('app');

  function fmtElapsed(sec){
    sec = Math.max(0, Math.floor(sec));
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return m + ':' + String(s).padStart(2,'0');
  }
  function fmtClock(ts){
    const d = new Date(ts);
    return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  }
  function isToday(ts){
    const d = new Date(ts), n = new Date();
    return d.getFullYear()===n.getFullYear() && d.getMonth()===n.getMonth() && d.getDate()===n.getDate();
  }

  // Works both inside Claude (window.storage) and on any web host (browser storage).
  const store = {
    async get(key){
      if(window.storage && window.storage.get){
        const res = await window.storage.get(key, false);
        return res && res.value ? res.value : null;
      }
      return window.localStorage.getItem(key);
    },
    async set(key, value){
      if(window.storage && window.storage.set){
        return window.storage.set(key, value, false);
      }
      window.localStorage.setItem(key, value);
    }
  };

  async function loadData(){
    try{
      const raw = await store.get(STORAGE_KEY);
      data = raw ? Object.assign({}, DEFAULT_DATA, JSON.parse(raw))
                 : Object.assign({}, DEFAULT_DATA);
    } catch(e){
      data = Object.assign({}, DEFAULT_DATA);
    }
  }

  async function saveData(){
    try{
      await store.set(STORAGE_KEY, JSON.stringify(data));
    } catch(e){
      console.error('Could not save', e);
    }
  }

  function computeStats(){
    const logs = data.logs || [];
    const todayLogs = logs.filter(l => isToday(l.ts));
    const todayAvg = todayLogs.length ? todayLogs.reduce((a,b)=>a+b.elapsed,0)/todayLogs.length : null;
    const todayFastest = todayLogs.length ? Math.min(...todayLogs.map(l=>l.elapsed)) : null;
    const allFastest = logs.length ? Math.min(...logs.map(l=>l.elapsed)) : null;
    const successCount = logs.filter(l => l.elapsed <= data.thresholdSec).length;
    const successRate = logs.length ? Math.round((successCount / logs.length) * 100) : null;
    return { todayAvg, todayFastest, allFastest, successRate };
  }

  // Group logs into per-day averages for the last N days that have records.
  function dailyAverages(maxDays){
    const buckets = {};
    (data.logs || []).forEach(l => {
      const d = new Date(l.ts);
      const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
      if(!buckets[key]) buckets[key] = { key, ts: l.ts, sum: 0, n: 0 };
      buckets[key].sum += l.elapsed;
      buckets[key].n += 1;
      if(l.ts < buckets[key].ts) buckets[key].ts = l.ts;
    });
    return Object.values(buckets)
      .map(b => ({ key: b.key, ts: b.ts, avg: b.sum / b.n, count: b.n }))
      .sort((a,b) => a.ts - b.ts)
      .slice(-maxDays);
  }

  function renderChart(){
    const days = dailyAverages(10);
    if(!days.length){
      return `<div class="chart-card">
        <div class="chart-head"><span class="t">Daily average</span></div>
        <div class="chart-empty">Your daily averages will<br>appear here as you log starts.</div>
      </div>`;
    }
    const threshold = data.thresholdSec;
    const maxVal = Math.max(threshold * 1.25, ...days.map(d => d.avg));
    const goalTopPct = (1 - threshold / maxVal) * 100;

    const cols = days.map(d => {
      const hPct = Math.max((d.avg / maxVal) * 100, 3);
      const gold = d.avg <= threshold;
      const dt = new Date(d.ts);
      const label = (dt.getMonth()+1) + '/' + dt.getDate();
      return `<div class="bar-col">
        <div class="bar-slot">
          <div class="bar ${gold ? 'gold' : ''}" style="height:${hPct}%" title="${label} · avg ${fmtElapsed(d.avg)} · ${d.count} start${d.count > 1 ? 's' : ''}"></div>
        </div>
      </div>`;
    }).join('');

    const labels = days.map(d => {
      const dt = new Date(d.ts);
      return `<span>${(dt.getMonth()+1)}/${dt.getDate()}</span>`;
    }).join('');

    return `<div class="chart-card">
      <div class="chart-head">
        <span class="t">Daily average</span>
        <span class="legend"><span class="swatch"></span>under ${Math.round(threshold/60)} min</span>
      </div>
      <div class="chart-body">
        <div class="goal-line" style="top:${goalTopPct.toFixed(1)}%">
          <span class="goal-tag">${Math.round(threshold/60)}:00</span>
        </div>
        <div class="bars">${cols}</div>
      </div>
      <div class="day-labels">${labels}</div>
    </div>`;
  }

  // ---- Gentle chime, one minute before the goal ----
  let audioCtx = null;
  let warned = false;
  let goalHopped = false;

  function ensureAudio(){
    try{
      if(!audioCtx){
        const AC = window.AudioContext || window.webkitAudioContext;
        if(!AC) return null;
        audioCtx = new AC();
      }
      if(audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    } catch(e){ return null; }
  }

  function playNote(ctx, freq, startAt, dur, peak){
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 2200;      // shave the edge off
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, startAt);
    gain.gain.exponentialRampToValueAtTime(peak, startAt + 0.05);   // soft attack
    gain.gain.exponentialRampToValueAtTime(0.0001, startAt + dur);  // long decay
    osc.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
    osc.start(startAt);
    osc.stop(startAt + dur + 0.05);
  }

  // Little hop from the dog at key moments.
  let hopTimer = null;
  function hopDog(){
    const el = document.getElementById('walker');
    if(!el) return;
    el.classList.remove('bark');
    void el.offsetWidth;           // restart the animation
    el.classList.add('bark');
    if(hopTimer) clearTimeout(hopTimer);
    hopTimer = setTimeout(() => el.classList.remove('bark'), 400);
  }

  function playChime(){
    if(data.soundOn === false) return;
    const ctx = ensureAudio();
    if(!ctx) return;
    const t = ctx.currentTime + 0.02;
    playNote(ctx, 784.0, t, 1.5, 0.07);          // G5
    playNote(ctx, 587.33, t + 0.42, 1.9, 0.055); // D5, a fifth below
  }

  // After the warning, the first note keeps repeating until GO! is pressed.
  let reminderHandle = null;
  let reminderMode = null;          // 'warning' before the goal, 'overtime' after it
  const REMINDER_BEFORE_MS = 3000;
  const REMINDER_AFTER_MS = 2000;

  function playReminderNote(){
    if(data.soundOn === false) return;
    const ctx = ensureAudio();
    if(!ctx) return;
    playNote(ctx, 784.0, ctx.currentTime + 0.02, 1.5, 0.055);   // G5, a touch softer
  }

  function startReminder(mode){
    if(reminderMode === mode && reminderHandle) return;   // already running at this tempo
    stopReminder();
    reminderMode = mode;
    reminderHandle = setInterval(
      playReminderNote,
      mode === 'overtime' ? REMINDER_AFTER_MS : REMINDER_BEFORE_MS
    );
  }
  function stopReminder(){
    if(reminderHandle){ clearInterval(reminderHandle); reminderHandle = null; }
    reminderMode = null;
  }

  // Short bright ping the moment GO! is pressed.
  function playGoTone(){
    if(data.soundOn === false) return;
    const ctx = ensureAudio();
    if(!ctx) return;
    const t = ctx.currentTime + 0.01;
    playNote(ctx, 1046.5, t, 0.35, 0.06);   // C6
  }

  // Rising arpeggio when the goal was met.
  function playFanfare(){
    if(data.soundOn === false) return;
    const ctx = ensureAudio();
    if(!ctx) return;
    const t = ctx.currentTime + 0.16;
    const notes = [523.25, 659.25, 783.99, 1046.5];   // C5 E5 G5 C6
    notes.forEach((f, i) => playNote(ctx, f, t + i * 0.105, 0.9 + i * 0.15, 0.055));
    playNote(ctx, 1318.5, t + 0.52, 1.5, 0.035);       // E6 shimmer on top
  }

  // Gold burst radiating from the dial.
  function celebrateBurst(){
    if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const dial = document.querySelector('.dial-wrap');
    if(!dial) return;
    const rect = dial.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;

    const layer = document.createElement('div');
    layer.className = 'burst-layer';
    const colors = ['#E9B441', '#C98A12', '#F5D77A', '#F2A62D'];

    for(let i = 0; i < 26; i++){
      const p = document.createElement('span');
      p.className = 'spark';
      const angle = (Math.PI * 2 * i) / 26 + (Math.random() - 0.5) * 0.24;
      const dist = 90 + Math.random() * 80;
      p.style.left = cx + 'px';
      p.style.top = cy + 'px';
      p.style.background = colors[i % colors.length];
      p.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
      p.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
      p.style.animationDelay = (Math.random() * 0.12).toFixed(2) + 's';
      const size = 5 + Math.random() * 5;
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      layer.appendChild(p);
    }
    document.body.appendChild(layer);
    setTimeout(() => layer.remove(), 1600);
  }

  // ---- Walking dog on the dial ----
  const DOG_SVG = `
  <svg viewBox="0 0 34 34" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <g class="bob">
      <!-- tail -->
      <path class="tail" d="M7 15 C3 13, 2 9, 4.5 7.5 C5.5 9.5, 6.5 12, 8.5 13.5 Z" />
      <!-- back legs -->
      <g class="leg-b">
        <rect class="dog-dark" x="8.5" y="19" width="3" height="7" rx="1.4"/>
      </g>
      <g class="leg-a">
        <rect class="dog-dark" x="20" y="19" width="3" height="7" rx="1.4"/>
      </g>
      <!-- body -->
      <rect class="dog-body" x="6.5" y="12" width="18" height="9" rx="4.5"/>
      <!-- front legs -->
      <g class="leg-a">
        <rect class="dog-body" x="11.5" y="19" width="3" height="7" rx="1.4"/>
      </g>
      <g class="leg-b">
        <rect class="dog-body" x="23" y="19" width="3" height="7" rx="1.4"/>
      </g>
      <!-- head -->
      <circle class="dog-body" cx="26" cy="12.5" r="5.4"/>
      <!-- ear -->
      <path class="dog-dark" d="M23.4 8.4 C22.4 6.2, 23.6 4.6, 25.4 5.2 C26.2 6.2, 26 7.6, 25.4 9 Z"/>
      <!-- muzzle -->
      <ellipse class="dog-light" cx="29.6" cy="14.2" rx="3.1" ry="2.3"/>
      <circle class="dog-nose" cx="31.6" cy="13.4" r="1.15"/>
      <circle class="dog-nose" cx="27" cy="11.4" r="0.95"/>
    </g>
  </svg>`;

  const DIAL_SIZE = 260;
  const DIAL_R = 108;
  const FEET_OFFSET = 9;   // distance from the dog's centre down to its paws

  // Walk the dog around the outside of the ring, treating the ring as ground.
  function positionWalker(p){
    const el = document.getElementById('walker');
    if(!el) return;
    const t = Math.min(Math.max(p, 0), 1);
    const angle = -Math.PI / 2 + t * Math.PI * 2;        // start at 12 o'clock, clockwise
    const radius = DIAL_R + FEET_OFFSET;                 // paws land on the ring
    const cx = DIAL_SIZE / 2 + Math.cos(angle) * radius;
    const cy = DIAL_SIZE / 2 + Math.sin(angle) * radius;
    const spin = angle * 180 / Math.PI + 90;             // keep paws pointing inward
    el.style.transform = `translate(${cx.toFixed(1)}px, ${cy.toFixed(1)}px) rotate(${spin.toFixed(1)}deg)`;
  }

  let lastResult = null; // { elapsed, celebrate } or null
  let justFinished = false;
  let finishTimer = null;
  let showResult = false;

  // Ring color ramp: muted sage → yellow → orange → red as the threshold approaches.
  const RAMP = [
    { p: 0.00, h: 108, s: 24, l: 60 },  // pale, muted green
    { p: 0.30, h: 68,  s: 52, l: 52 },  // yellow-green
    { p: 0.52, h: 46,  s: 82, l: 50 },  // yellow
    { p: 0.76, h: 27,  s: 88, l: 51 },  // orange
    { p: 1.00, h: 12,  s: 75, l: 44 }   // red
  ];
  function ringColorParts(p){
    const t = Math.min(Math.max(p, 0), 1);
    let a = RAMP[0], b = RAMP[RAMP.length - 1];
    for(let i = 0; i < RAMP.length - 1; i++){
      if(t >= RAMP[i].p && t <= RAMP[i+1].p){ a = RAMP[i]; b = RAMP[i+1]; break; }
    }
    const span = b.p - a.p;
    const k = span === 0 ? 0 : (t - a.p) / span;
    return {
      h: a.h + (b.h - a.h) * k,
      s: a.s + (b.s - a.s) * k,
      l: a.l + (b.l - a.l) * k
    };
  }
  function ringColor(p){
    const c = ringColorParts(p);
    return `hsl(${c.h.toFixed(1)}, ${c.s.toFixed(0)}%, ${c.l.toFixed(0)}%)`;
  }

  // GO! button shades: same hue as the ring, deepened so the gold label stays readable.
  function goButtonStyle(p){
    const c = ringColorParts(p);
    const s = Math.min(c.s + 14, 90);
    const base = Math.min(c.l, 44);
    const hi = base + 14;
    const deep = base - 9;
    const hsl = (l) => `hsl(${c.h.toFixed(1)}, ${s.toFixed(0)}%, ${l.toFixed(0)}%)`;
    return {
      background: `radial-gradient(circle at 34% 28%, ${hsl(hi)}, ${hsl(base)} 58%, ${hsl(deep)} 100%)`,
      shadow: `0 12px 30px -10px hsla(${c.h.toFixed(1)}, ${s.toFixed(0)}%, ${deep.toFixed(0)}%, 0.55), inset 0 -3px 8px hsla(${c.h.toFixed(1)}, ${s.toFixed(0)}%, ${(deep-8).toFixed(0)}%, 0.3)`,
      halo: hsl(base)
    };
  }

  function render(){
    const running = data.runningStart != null;
    const elapsedNow = running ? (Date.now() - data.runningStart) / 1000 : 0;
    const stats = computeStats();

    // One full revolution = the threshold you set.
    const rawProgress = running ? elapsedNow / data.thresholdSec : 0;
    const progress = Math.min(rawProgress, 1);
    const overtime = rawProgress > 1;
    const circumference = 2 * Math.PI * 108;
    const dashoffset = circumference * (1 - progress);
    const strokeColor = ringColor(running ? rawProgress : (showResult ? lastResult.elapsed / data.thresholdSec : 0));

    const logs = (data.logs || []).slice().sort((a,b)=>b.ts-a.ts).slice(0, 12);

    app.innerHTML = `
      <div class="eyebrow"><span class="dot"></span>Start Log</div>
      <h1>Ready When You Are</h1>
      <div class="paw-mark">
        <svg viewBox="0 0 40 34" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <ellipse cx="20" cy="25" rx="8.6" ry="7"/>
          <ellipse cx="9.5" cy="14.5" rx="4" ry="5.2" transform="rotate(-18 9.5 14.5)"/>
          <ellipse cx="16.5" cy="8" rx="3.7" ry="5"/>
          <ellipse cx="24.5" cy="8" rx="3.7" ry="5"/>
          <ellipse cx="31" cy="14.5" rx="4" ry="5.2" transform="rotate(18 31 14.5)"/>
        </svg>
      </div>
      <div class="sub">Measuring your time to first action.</div>

      <div class="dial-wrap">
        <div class="glow ${running ? 'running' : ''}" style="background: radial-gradient(circle, ${strokeColor} 0%, transparent 70%)"></div>
        <svg class="ring" width="260" height="260" viewBox="0 0 260 260">
          <circle class="ring-track" cx="130" cy="130" r="108" fill="none" stroke-width="8"/>
          <circle class="ring-fill ${overtime ? 'overtime' : ''}"
                  cx="130" cy="130" r="108" fill="none" stroke-width="8"
                  stroke="${strokeColor}"
                  stroke-dasharray="${circumference}"
                  stroke-dashoffset="${running || showResult ? dashoffset : circumference}"/>
        </svg>
        <div class="dial-center">
          <div class="time-display">${running ? fmtElapsed(elapsedNow) : (showResult ? fmtElapsed(lastResult.elapsed) : '0:00')}</div>
          <div class="state-label">${running ? (overtime ? 'elapsed' : 'counting...') : (showResult ? 'logged' : 'standing by')}</div>
        </div>
        <div class="walker ${running ? '' : 'idle'}" id="walker">${DOG_SVG}</div>
      </div>

      <div class="btn-slot">
        ${running ? (() => { const go = goButtonStyle(rawProgress); return `
          <div class="checkin-wrap">
            <span class="halo" style="border-color:${go.halo}"></span>
            <span class="halo d2" style="border-color:${go.halo}"></span>
            <span class="halo d3" style="border-color:${go.halo}"></span>
            <button class="checkin-btn" id="mainBtn" style="background:${go.background}; box-shadow:${go.shadow}">GO!</button>
          </div>
        `; })() : (justFinished ? `
          <div class="started-msg ${lastResult && lastResult.celebrate ? 'gold' : ''}">
            ${lastResult && lastResult.celebrate ? '<div class="medal">🏅</div>' : ''}
            <div class="big">${lastResult && lastResult.celebrate ? 'Great start!' : "You're underway."}</div>
            <div class="small">${lastResult && lastResult.celebrate ? `Off the line in ${fmtElapsed(lastResult.elapsed)}. I'm rooting for you.` : "I'm rooting for you."}</div>
            <button class="msg-reset" id="dismissMsg">RESET</button>
          </div>
        ` : `
          <button class="action-btn" id="mainBtn">READY...</button>
        `)}
      </div>

      <div class="result ${showResult ? 'show' : ''} ${lastResult && lastResult.celebrate ? 'celebrate' : ''}">
        ${showResult ? (lastResult.celebrate
            ? `🔥 Off the line in ${fmtElapsed(lastResult.elapsed)} — under your ${Math.round(data.thresholdSec/60)} min line`
            : `Logged a start of ${fmtElapsed(lastResult.elapsed)}`)
          : '&nbsp;'}
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Today's average</div>
          <div class="stat-value">${stats.todayAvg != null ? fmtElapsed(stats.todayAvg) : '—'}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Today's best</div>
          <div class="stat-value">${stats.todayFastest != null ? fmtElapsed(stats.todayFastest) : '—'}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">All-time best</div>
          <div class="stat-value accent">${stats.allFastest != null ? fmtElapsed(stats.allFastest) : '—'}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Under ${Math.round(data.thresholdSec/60)} min</div>
          <div class="stat-value accent">${stats.successRate != null ? stats.successRate + '%' : '—'}</div>
        </div>
      </div>

      ${renderChart()}

      <div>
        <div class="section-title">
          <span>History</span>
          ${logs.length ? '<button class="reset-btn" id="resetBtn">clear all</button>' : ''}
        </div>
        <div style="height:8px"></div>
        ${logs.length ? `<div class="log-list">${logs.map(l => `
          <div class="log-item">
            <div class="left"><span class="badge">${l.elapsed <= data.thresholdSec ? '🔥' : '🕐'}</span>${fmtClock(l.ts)}</div>
            <div class="elapsed ${l.elapsed <= data.thresholdSec ? 'fast' : ''}">${fmtElapsed(l.elapsed)}</div>
          </div>
        `).join('')}</div>` : `<div class="empty-state">No starts logged yet. Press READY... to time your first one.</div>`}
      </div>

      <div class="settings">
        <span>Goal line</span>
        <div style="display:flex; align-items:center; gap:6px;">
          <input type="number" id="thresholdInput" min="1" max="60" value="${Math.round(data.thresholdSec/60)}"> min or less
        </div>
      </div>

      <div class="settings">
        <span>Chime &amp; nudges</span>
        <button class="toggle ${data.soundOn === false ? '' : 'on'}" id="soundToggle">
          ${data.soundOn === false ? 'OFF' : 'ON'}
        </button>
      </div>
    `;

    const mainBtn = document.getElementById('mainBtn');
    if(mainBtn) mainBtn.addEventListener('click', onMainBtn);
    positionWalker(running ? rawProgress : (showResult ? lastResult.elapsed / data.thresholdSec : 0));
    const dismissMsg = document.getElementById('dismissMsg');
    if(dismissMsg) dismissMsg.addEventListener('click', dismissFinished);
    const resetBtn = document.getElementById('resetBtn');
    if(resetBtn) resetBtn.addEventListener('click', onReset);
    const thresholdInput = document.getElementById('thresholdInput');
    if(thresholdInput) thresholdInput.addEventListener('change', onThresholdChange);
    const soundToggle = document.getElementById('soundToggle');
    if(soundToggle) soundToggle.addEventListener('click', onSoundToggle);
  }

  async function onSoundToggle(){
    data.soundOn = data.soundOn === false;   // flip
    if(!data.soundOn) stopReminder();
    await saveData();
    render();
    if(data.soundOn){ ensureAudio(); playChime(); }   // preview it once
  }

  function dismissFinished(){
    if(finishTimer){ clearTimeout(finishTimer); finishTimer = null; }
    justFinished = false;
    render();
  }

  async function onMainBtn(){
    if(data.runningStart == null){
      // start
      if(finishTimer){ clearTimeout(finishTimer); finishTimer = null; }
      justFinished = false;
      warned = false;
      goalHopped = false;
      stopReminder();
      ensureAudio();   // unlock audio while we still have the click gesture
      data.runningStart = Date.now();
      showResult = false;
      lastResult = null;
      await saveData();
      startTicking();
      render();
    } else {
      // check in
      const elapsedSec = (Date.now() - data.runningStart) / 1000;
      const celebrate = elapsedSec <= data.thresholdSec;
      data.logs = data.logs || [];
      data.logs.push({ ts: Date.now(), elapsed: elapsedSec });
      data.runningStart = null;
      lastResult = { elapsed: elapsedSec, celebrate };
      showResult = true;
      justFinished = true;
      stopTicking();
      stopReminder();
      playGoTone();
      if(celebrate){
        playFanfare();
      }
      await saveData();
      render();
      if(celebrate) celebrateBurst();
    }
  }

  async function onReset(){
    if(!confirm('Delete every logged start? This cannot be undone.')) return;
    data.logs = [];
    lastResult = null;
    showResult = false;
    await saveData();
    render();
  }

  async function onThresholdChange(e){
    let v = parseInt(e.target.value, 10);
    if(isNaN(v) || v < 1) v = 1;
    if(v > 60) v = 60;
    data.thresholdSec = v * 60;
    await saveData();
    render();
  }

  function tick(){
    if(data.runningStart == null) return;
    const elapsedNow = (Date.now() - data.runningStart) / 1000;
    const remaining = data.thresholdSec - elapsedNow;

    // One-minute warning (only meaningful when the goal is longer than a minute)
    if(!warned && data.thresholdSec > 60 && remaining <= 60 && remaining > 0){
      warned = true;
      playChime();
      hopDog();                 // first hop: a minute to go
      startReminder('warning');
    }
    // Past the goal line, nudge a little more often.
    if(remaining <= 0){
      if(!goalHopped){
        goalHopped = true;
        hopDog();               // second hop: the goal line has passed
      }
      if(data.soundOn !== false) startReminder('overtime');
    }
    const rawProgress = elapsedNow / data.thresholdSec;
    const progress = Math.min(rawProgress, 1);
    const circumference = 2 * Math.PI * 108;

    const fill = document.querySelector('.ring-fill');
    const clock = document.querySelector('.time-display');
    const label = document.querySelector('.state-label');
    const glow = document.querySelector('.glow');
    if(!fill || !clock) return;

    const color = ringColor(rawProgress);
    fill.setAttribute('stroke', color);
    fill.setAttribute('stroke-dashoffset', circumference * (1 - progress));
    fill.classList.toggle('overtime', rawProgress > 1);
    clock.textContent = fmtElapsed(elapsedNow);
    if(label) label.textContent = rawProgress > 1 ? 'elapsed' : 'counting...';
    if(glow) glow.style.background = `radial-gradient(circle, ${color} 0%, transparent 70%)`;

    const go = goButtonStyle(rawProgress);
    const goBtn = document.querySelector('.checkin-btn');
    if(goBtn){
      goBtn.style.background = go.background;
      goBtn.style.boxShadow = go.shadow;
    }
    document.querySelectorAll('.halo').forEach(h => { h.style.borderColor = go.halo; });
    positionWalker(rawProgress);
  }

  function startTicking(){
    stopTicking();
    tickHandle = setInterval(tick, 200);
  }
  function stopTicking(){
    if(tickHandle){ clearInterval(tickHandle); tickHandle = null; }
  }

  async function init(){
    await loadData();
    if(data.runningStart != null) startTicking();
    render();
  }

  init();
})();
</script>

</body>
</html>
